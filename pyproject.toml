[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "benchweave-adc"
version = "0.2.0"
description = "BenchWeave plugin project for the 6-channel 12-bit ADC board: OTDP adapter, protocol codec and discovery, served by the standalone benchweave-sdk host."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [
  { name = "Stephen Eaton" }
]
keywords = [
  "adc",
  "benchweave",
  "data-acquisition",
  "embedded systems",
  "instrumentation",
  "otdp",
  "serial"
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed"
]
dependencies = [
    "pyserial>=3.5",
]

[project.optional-dependencies]
# The standalone host (UI/REST/MCP + serial transport) is an optional
# install: the default install stays a plain plugin project with no SDK
# runtime import. 0.7.1 is the published floor carrying the [server]
# extra and the standalone plugin-project loader.
host = ["benchweave-sdk[server]>=0.7.1"]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
  "mypy>=1.11",
  "pytest-timeout>=2.3",
  "httpx>=0.27",
  "pytest-cov>=5",
  # Dev-only: adapter conformance (MockHost/check_lifecycle), offline
  # descriptor/envelope validation, and the standalone-host proof arms
  # (load_plugin_project + TestClient smoke). Runtime plugin code never
  # imports the SDK — the Adapter/HostServices contracts are structural
  # Protocols.
  "benchweave-sdk[server]>=0.7.1",
]

[project.scripts]
benchweave-adc = "benchweave.__main__:main"
nanodla-mcp = "benchweave.nanodla_mcp:main"

[tool.hatch.build.targets.wheel]
packages = ["src/benchweave", "src/adc_6ch_12bit"]

[tool.pytest.ini_options]
addopts = "-q -p no:cacheprovider"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src/benchweave", "src/adc_6ch_12bit", "tests"]

# Coverage is report-only (run with `pytest --cov`); no threshold is enforced.
[tool.coverage.run]
source = ["src/benchweave", "src/adc_6ch_12bit"]
branch = true
