[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "benchweave"
version = "0.1.0"
description = "Local test-bench gateway for reusable instrument and DUT plugins."
readme = "docs/project-index.md"
requires-python = ">=3.13"
license = "MIT"
authors = [
  { name = "Stephen Eaton" }
]
keywords = [
  "test automation",
  "embedded systems",
  "instrumentation",
  "hardware-in-the-loop"
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed"
]
dependencies = [
  "click>=8.1",
  "cryptography>=50.0.1",
  "fastapi>=0.141.1",
  "fastmcp[server]==4.0.3",
  "jsonschema>=4.23",
  "rfc3339-validator>=0.1.4",
  "rfc3987>=1.3.8",
  "textual>=1.0",
  "uvicorn>=0.52.4",
]

[dependency-groups]
dev = [
  "anyio>=4",
  "pytest>=8.0",
  "ruff>=0.6",
  "mypy>=1.11",
  "referencing>=0.35",
  "types-jsonschema>=4.26.0.20260518",
  "httpx>=0.28.1",
]

[project.scripts]
benchweave = "benchweave.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/benchweave"]
# The runtime's vendored assets (contract corpora + the simulator plugins)
# live at the repo root beside the suites that pin them; a wheel install has
# no repo around it, so the same trees ship verbatim inside the package
# (resolved by benchweave/vendoring.py — packaged-first, repo fallback).
# The fixture lattice is deliberately NOT packaged: it is operator-supplied
# input (--fixtures / BENCHWEAVE_FIXTURES, disclosed repo-relative default).
[tool.hatch.build.targets.wheel.force-include]
"standards" = "benchweave/_vendored/contracts"
"plugins/benchweave" = "benchweave/_vendored/plugins/benchweave"

[tool.pytest.ini_options]
addopts = "-q -p no:cacheprovider"
testpaths = ["tests"]
# xunit1 is the repo default so any --junitxml run agrees with the evidence
# faults harvest (which pins the same family explicitly): xunit2 rejects
# <properties> inside <testcase> — the recorded measurements the fault-leg
# tests emit via record_property — warning on every leg.
junit_family = "xunit1"
markers = [
  "slow: real child-process orchestration (kill-mid-run); deselect in CI with -m 'not slow'",
]

[tool.ruff]
line-length = 100
target-version = "py313"
# packages/sdk lints in its own repository's CI with its own pinned config;
# double-linting it here couples this gate to ruff-version skew between the
# two repos (new rules land here first and fail on submodule code this repo
# cannot edit — submodule fixes are two-commit, SDK-first).
extend-exclude = ["docs", "packages/sdk"]

[tool.ruff.lint]
# S (flake8-bandit) is the security lint the tree's existing `# noqa: S603`
# suppressions were written for; RUF100 keeps every noqa honest.
select = ["E", "F", "I", "UP", "B", "SIM", "S", "RUF100"]

[tool.ruff.lint.per-file-ignores]
# Test code asserts freely, shells out to trusted repo-local commands, opens
# loopback URLs, and uses dummy credentials and fixed paths by design.
"tests/**" = ["S101", "S104", "S105", "S106", "S108", "S310", "S603", "S607"]
"plugins/*/*/tests/**" = ["S101"]
# Repo maintenance scripts run trusted, fixed commands; sdk_smoke's asserts
# ARE its failure mechanism (run directly, never under -O).
"scripts/**" = ["S603", "S607"]
"scripts/sdk_smoke.py" = ["S101", "S603", "S607"]

[tool.mypy]
python_version = "3.13"
strict = true
# scripts/architecture stays out of scope except _validation_report.py — it is
# CI-load-bearing (the report family's writer/pin substrate), so it types clean
# on its own; the sibling check scripts keep their historical exclusion.
files = [
    "src/benchweave",
    "tests",
    "scripts/registry",
    "packages/sdk/src",
    "scripts/sdk_smoke.py",
    "scripts/architecture/_validation_report.py",
]
# Independent manufacturer/model projects use their own environments and CI checks.
exclude = ['^plugins/[^/]+/[^/]+/']
