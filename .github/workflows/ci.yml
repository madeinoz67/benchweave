name: ci

on:
  push:
    branches: [main]
  pull_request:
  # R1 (issue #471): the weekly full-selection Windows run — the
  # complement-corroboration lane. Only the windows-full job runs on this
  # trigger; every other job guards itself out with
  # `if: github.event_name != 'schedule'`.
  schedule:
    - cron: "23 2 * * 1"

jobs:
  gates:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0 # train_window reads version-dir addition history (#97)

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.13"

      - name: Materialise fixture signing keys from repo secrets
        env:
          BENCHWEAVE_FIXTURE_KEY_MAIN: ${{ secrets.BENCHWEAVE_FIXTURE_KEY_MAIN }}
          BENCHWEAVE_FIXTURE_KEY_ORIGINB: ${{ secrets.BENCHWEAVE_FIXTURE_KEY_ORIGINB }}
        # Fork PRs receive empty secrets; writing empty key files used to make
        # the signing tests fail confusingly for every external contributor.
        # Write a key only when its secret is present — the signing tests skip
        # (with a named reason) when the files are absent.
        run: |
          if [ -n "$BENCHWEAVE_FIXTURE_KEY_MAIN" ]; then
            printf '%s' "$BENCHWEAVE_FIXTURE_KEY_MAIN" > fixtures/registry/keys/main.pem
          else
            echo "::notice::BENCHWEAVE_FIXTURE_KEY_MAIN unavailable (fork PR?); signing tests will skip"
          fi
          if [ -n "$BENCHWEAVE_FIXTURE_KEY_ORIGINB" ]; then
            printf '%s' "$BENCHWEAVE_FIXTURE_KEY_ORIGINB" > fixtures/registry/keys/originb.pem
          else
            echo "::notice::BENCHWEAVE_FIXTURE_KEY_ORIGINB unavailable (fork PR?); signing tests will skip"
          fi

      - name: Sync environment
        # --locked: the committed lockfile is the environment CI tests;
        # package.yml separately proves the lock is fresh (uv lock --check).
        run: uv sync --locked

      - name: Lint
        run: |
          uv run ruff check .
          # Config-driven: pyproject [tool.mypy] files= includes packages/sdk/src,
          # so benchweave_sdk resolves for the tests that import it. Explicit
          # path args drop it from the build and break those imports.
          uv run mypy

      - name: Test
        # Complementary partition with the timing and browser jobs (issue
        # #241 slice 1; #300 G1d slice 4): `-m "not timing and not
        # browser"` here + `-m timing` there + `-m browser` in the browser
        # job = the full collection — structural by construction (the
        # complementary markers admit no fourth state), with the proof at
        # PR time: the builder diffs the three collected-id lists against
        # the unfiltered collection (union equal, pairwise intersections
        # empty) and records it in the PR body (design §5 AR-1; not an
        # automated gate), so no test loses CI execution. The
        # real-paced set runs on its own fresh VM in the timing lane instead
        # of behind this job's bulk-suite residue. Parallel via pytest-xdist
        # (issue #247 increment 2): the timing lane stays serialized — xdist
        # there would reintroduce the competition the lane removes (issue #241
        # slice 1).
        run: uv run pytest -q -n auto -m "not timing and not browser"

      - name: Standards sync check
        # Re-export the corpus to a temp dir and refuse any drift between
        # the main-repo standards, the SDK lock and the vendored tree.
        run: make check-sdk-standards

  timing:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.13"

      - name: Sync environment
        run: uv sync --locked

      # The real-paced lane (issue #241 slice 1): the marked set runs
      # serialized on its own fresh VM, within ~2 min of boot, so its
      # wall-clock bands are measured before any bulk-suite residue (page
      # cache, draining threads, WAL checkpoints) lands on the runner — and
      # a red in the real-paced subset reads as a timing question, not a
      # logic one. Exception: the continuity file's ride-along logic tests
      # (design-record ride-along disclosure) can red as logic. No lint, no
      # mypy, no fixture keys, no standards check: gates runs those over the
      # same tree, and no marked test depends on the signing keys (the
      # signing tests are registry tests, unmarked). Stays SERIAL FOREVER:
      # adopting xdist here would reintroduce exactly the intra-suite
      # competition this lane exists to remove. What this lane cannot buy is
      # a quiet host — a noisy neighbor can still stretch a band; slice 2's
      # re-bands (resolved as HOLD/document-only in that slice) are the answer
      # to that, not parallelism.
      - name: Test (timing lane)
        run: uv run pytest -q -m timing

  browser:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.13"

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('uv.lock') }}

      - name: Sync environment
        run: uv sync --locked

      - name: Install chromium
        run: uv run playwright install chromium

      # The browser lane (issue #300 G1d slice 4; UR-09/Q6 — G1a deferral
      # D2 landing): the Playwright-driven set over the file:// pattern
      # library — axe at WCAG 2.2 AA on every page x both themes (with the
      # planted-violation control proving the measurement detects), one
      # screenshot per PATTERNS entry per theme, the export census, and the
      # RoleResolver disagreement check (G1a risk 4). Serialized: the
      # browsers are a shared resource and the lane owns them (#241's lane
      # shape — no xdist here, ever).
      - name: Test (browser lane)
        run: uv run pytest -q -m browser

  systemd:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.13"

      - name: Sync environment
        run: uv sync --locked

      - name: Render and verify the systemd unit template
        run: |
          set -euo pipefail
          # A missing verifier is a skip that must never pass silently.
          if ! command -v systemd-analyze >/dev/null 2>&1; then
            echo "::error::systemd-analyze is required to verify deploy/systemd/ but is absent on this runner"
            exit 1
          fi
          # NOTE: the pytest suite's `{{`-absence assertion on the rendered
          # template (tests/cli/test_serve.py) is the guard that catches a
          # missed placeholder — systemd-analyze verify can tolerate literal
          # braces in some directive positions. Do not "simplify" that test
          # away; this job and it catch complementary failure modes.
          # Rehearse the deployment preconditions the rendered unit names:
          # the dedicated system user, the one writable data dir, the env file.
          sudo useradd --system --no-create-home --shell /usr/sbin/nologin benchweave
          sudo mkdir -p /var/lib/benchweave /etc/benchweave
          sudo touch /etc/benchweave/benchweave.env
          sed -e 's|{{DATA_DIR}}|/var/lib/benchweave|g' \
              -e 's|{{ENV_FILE}}|/etc/benchweave/benchweave.env|g' \
              -e 's|{{TIMEOUT_STOP_SEC}}|90s|g' \
              deploy/systemd/benchweave.service.template > /tmp/benchweave.service
          systemd-analyze verify /tmp/benchweave.service
          # Issue #422 inc3 (obligation 9's extension): the rehearsal also
          # renders through `service install`'s own renderer over a REAL
          # (fresh, uncommissioned) store — the code path that derives
          # TimeoutStopSec must produce a unit the verifier accepts (the
          # uncommissioned fallback arm in tests/cli/test_lifecycle.py pins
          # the rendered comment; this leg proves the rendered unit parses).
          # The fresh store must be RUNNER-WRITABLE — /var/lib/benchweave is
          # root-owned from the precondition mkdir above (the sed leg only
          # renders text into it; setup writes content). First-rollup catch.
          RENDER_DATA_DIR="$RUNNER_TEMP/benchweave-render-store"
          uv run python -m benchweave setup --data-dir "$RENDER_DATA_DIR"
          uv run python -m benchweave service install \
            --data-dir "$RENDER_DATA_DIR" --unit-output /tmp/benchweave.rendered.service
          systemd-analyze verify /tmp/benchweave.rendered.service

  windows:
    # The Windows evidence lane, scoped to the cross-platform CORE subset
    # (issue #207 lane origin; #471 core subset). Selection classes: W1
    # platform-branching source units (whole-module marks pinned by the
    # source probe), W2 platform-sensitive semantics (per-test marks, each
    # carrying CI-measured platform evidence), W3 the digest canary. The
    # ratchet manifest (tests/win_core_manifest.json, checked by
    # scripts/ci/win_core_manifest.py --check in gates) makes every
    # selection change a visible diff; the complement rides the weekly
    # windows-full lane (R1) instead of every PR.
    # EVIDENCE POSTURE (unchanged): continue-on-error on the test step
    # only — a test red does not block merges (merge-verified.sh reads
    # the job conclusion; its zero-red rollup rule is unchanged) and is
    # carried instead by the warning annotation, the job summary, and the
    # junitxml artifact. Setup failures have NO continue-on-error: a
    # broken lane blocks like any broken CI. Graduation (slice 2) deletes
    # one line.
    # TIMEOUT: 20m (R5, issue #471 — the core subset's measured expected
    # wall is ~4-5 min; 4x headroom. The old 45m covered the full
    # selection; the standing retro row about splitting lifecycle/diagnose
    # onto their own lane is obsoleted by the subset — R3).
    if: github.event_name != 'schedule'
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0 # train_window reads version-dir history (#97)

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.13"

      - name: Materialise fixture signing keys from repo secrets
        env:
          BENCHWEAVE_FIXTURE_KEY_MAIN: ${{ secrets.BENCHWEAVE_FIXTURE_KEY_MAIN }}
          BENCHWEAVE_FIXTURE_KEY_ORIGINB: ${{ secrets.BENCHWEAVE_FIXTURE_KEY_ORIGINB }}
        run: |
          if [ -n "$BENCHWEAVE_FIXTURE_KEY_MAIN" ]; then
            printf '%s' "$BENCHWEAVE_FIXTURE_KEY_MAIN" > fixtures/registry/keys/main.pem
          else
            echo "::notice::BENCHWEAVE_FIXTURE_KEY_MAIN unavailable (fork PR?); signing tests will skip"
          fi
          if [ -n "$BENCHWEAVE_FIXTURE_KEY_ORIGINB" ]; then
            printf '%s' "$BENCHWEAVE_FIXTURE_KEY_ORIGINB" > fixtures/registry/keys/originb.pem
          else
            echo "::notice::BENCHWEAVE_FIXTURE_KEY_ORIGINB unavailable (fork PR?); signing tests will skip"
          fi

      - name: Sync environment
        run: uv sync --locked

      # Byte-exactness: checkout relies on the committed .gitattributes
      # (`* text=auto eol=lf`) in this repo AND in packages/sdk — eol=lf
      # overrides the Windows runner's default core.autocrlf, so worktree
      # bytes equal the committed LF bytes and every digest reads the same
      # input as on Linux. No git-config step is wanted; a digest-mismatch
      # red here is the canary for that posture regressing, on the OS
      # where it would regress.
      - name: Test (windows evidence lane — core subset)
        continue-on-error: true
        run: >-
          uv run pytest -q -n auto -m wincore
          --junitxml=windows-evidence.xml

      - name: Evidence summary
        if: always()
        run: |
          uv run python - <<'PY'
          import os, xml.etree.ElementTree as ET
          root = ET.parse("windows-evidence.xml").getroot()
          counts = {k: int(root.get(k, "0")) for k in
                    ("tests", "failures", "errors", "skipped")}
          failed = [tc.get("name") for tc in root.iter("testcase")
                    if tc.find("failure") is not None or tc.find("error") is not None]
          lines = [f"### Windows evidence lane (core subset, issue #471)",
                   f"- selection: `-m wincore` — W1 platform-branching units, W2 "
                   f"platform-sensitive semantics, W3 the digest canary; the "
                   f"complement rides the weekly windows-full lane (R1)",
                   f"- tests {counts['tests']} · failures {counts['failures']} "
                   f"· errors {counts['errors']} · skipped {counts['skipped']}"]
          if failed:
              lines.append("- failing ids (evidence for #207 — non-blocking by design, slice 1):")
              lines += [f"  - `{n}`" for n in failed]
              print(f"::warning::windows evidence lane: {len(failed)} failing id(s) — "
                    f"see summary; census discipline: record on #207")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as fh:
              fh.write("\n".join(lines) + "\n")
          PY

      - name: Upload junitxml evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-evidence-junit
          path: windows-evidence.xml

  windows-full:
    # R1 (issue #471): the WEEKLY full-selection Windows run — the
    # complement-corroboration lane. Runs the SAME selection the windows
    # job ran before the core subset (~18 min measured, PR #464's lane),
    # so the ~3,853-test complement keeps a reproduction surface and the
    # #207 census's whole-run comparability survives the scoping. Same
    # evidence posture: continue-on-error on the test step only, junitxml
    # artifact, failing-id summary; setup failures block; the artifact
    # name differs so both lanes' evidence never collides.
    # TIMEOUT: 45m — the full selection's own measured wall is ~18-19 min.
    if: github.event_name == 'schedule'
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0 # train_window reads version-dir history (#97)

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.13"

      - name: Materialise fixture signing keys from repo secrets
        env:
          BENCHWEAVE_FIXTURE_KEY_MAIN: ${{ secrets.BENCHWEAVE_FIXTURE_KEY_MAIN }}
          BENCHWEAVE_FIXTURE_KEY_ORIGINB: ${{ secrets.BENCHWEAVE_FIXTURE_KEY_ORIGINB }}
        run: |
          if [ -n "$BENCHWEAVE_FIXTURE_KEY_MAIN" ]; then
            printf '%s' "$BENCHWEAVE_FIXTURE_KEY_MAIN" > fixtures/registry/keys/main.pem
          else
            echo "::notice::BENCHWEAVE_FIXTURE_KEY_MAIN unavailable (fork PR?); signing tests will skip"
          fi
          if [ -n "$BENCHWEAVE_FIXTURE_KEY_ORIGINB" ]; then
            printf '%s' "$BENCHWEAVE_FIXTURE_KEY_ORIGINB" > fixtures/registry/keys/originb.pem
          else
            echo "::notice::BENCHWEAVE_FIXTURE_KEY_ORIGINB unavailable (fork PR?); signing tests will skip"
          fi

      - name: Sync environment
        run: uv sync --locked

      - name: Test (windows-full complement lane)
        continue-on-error: true
        run: >-
          uv run pytest -q -n auto -m "not timing and not browser"
          --junitxml=windows-evidence-full.xml

      - name: Evidence summary
        if: always()
        run: |
          uv run python - <<'PY'
          import os, xml.etree.ElementTree as ET
          root = ET.parse("windows-evidence-full.xml").getroot()
          counts = {k: int(root.get(k, "0")) for k in
                    ("tests", "failures", "errors", "skipped")}
          failed = [tc.get("name") for tc in root.iter("testcase")
                    if tc.find("failure") is not None or tc.find("error") is not None]
          lines = [f"### Windows-FULL evidence lane (weekly complement run, R1 of issue #471)",
                   f"- selection: the gates selection (not timing, not browser) — the "
                   f"whole-run census comparability the core subset gave up",
                   f"- tests {counts['tests']} · failures {counts['failures']} "
                   f"· errors {counts['errors']} · skipped {counts['skipped']}"]
          if failed:
              lines.append("- failing ids (evidence for #207 — non-blocking by design):")
              lines += [f"  - `{n}`" for n in failed]
              print(f"::warning::windows-full lane: {len(failed)} failing id(s) — "
                    f"see summary; census discipline: record on #207")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as fh:
              fh.write("\n".join(lines) + "\n")
          PY

      - name: Upload junitxml evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-evidence-full-junit
          path: windows-evidence-full.xml

  sdk-drift:
    if: github.event_name != 'schedule'
    # The declared-pin lane (issue #408 S2): the committed packages/sdk
    # gitlink must equal the DECLARED pin in .gitmodules
    # (submodule.packages/sdk.pin — a vX.Y.Z release tag or a 40-hex
    # SHA). The pin and the gitlink move in the SAME commit and the lane
    # enforces exactly that; the pin IS the declaration, so a mid-train
    # era-bind mount declares itself with a SHA pin and stays green
    # OFFLINE (the old latest-tag gate reddened every such push by
    # construction). The freshness signal moved from hard-red to
    # annotation: a trailing pin is green with ::warning:: (the
    # family-doc walk row reads it — owner fork F3, never a machine
    # gate), a fetch failure is ::notice:: on a SHA pin (the verdict is
    # local) and indeterminate on a tag pin (never worse than before).
    # Deliberately no submodule checkout: the gitlink is read from the
    # superproject's committed tree. Exit contract: 0 green (pin
    # matches), 1 red (pin/gitlink disagree — they move in the same commit,
    # enforced at every ref the lane observes: CI sees pushed refs, so an
    # intermediate of a split train is unobserved until pushed), 2
    # indeterminate (fail closed: no gitlink, pin absent or malformed,
    # tag-pin resolution failed, undecodable bytes). CONSISTENCY stays
    # `gates`' make check-sdk-standards.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check the packages/sdk gitlink against its declared pin
        run: python3 scripts/check_sdk_submodule_drift.py
