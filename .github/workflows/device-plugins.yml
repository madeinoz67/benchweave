name: device-plugins

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  dps150-independent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.13"
      - name: Version-literal zero gate (plugins + docs scopes)
        # Issue #221 (#203 slice 7, completing D8/#233's plugin lane): the
        # in-tree plugin source and the operator docs are gated trees. The
        # counter is stdlib-only and the checkout is present at job start;
        # the plugin's own isolated test run below is untouched. The sdk
        # scope is deliberately NOT here — the SDK lane (the SDK repo's ci)
        # and the gates job's sdk scope own it.
        run: python3 scripts/standards/count_version_literals.py --scope plugins,docs
      - name: Isolate the device project from the core checkout
        run: cp -R plugins/fnirsi/dps150 "$RUNNER_TEMP/dps150"
      - name: Install the plugin development environment
        working-directory: ${{ runner.temp }}/dps150
        run: uv sync --locked --dev
      - name: Fetch pinned contract test dependencies
        working-directory: ${{ runner.temp }}/dps150
        run: uv run --locked python scripts/fetch_contracts.py
      - name: Offline conformance and quality checks
        working-directory: ${{ runner.temp }}/dps150
        run: |
          uv run --locked --offline python scripts/fetch_contracts.py --check
          uv run --locked --offline pytest
          uv run --locked --offline ruff check .
          uv run --locked --offline ruff format --check .
          uv run --locked --offline mypy
      - name: Build independent release candidates without publishing
        working-directory: ${{ runner.temp }}/dps150
        run: uv build

  adc-6ch-highrate:
    # Issue #393: the adc_6ch_12bit device project's tests (the v2 wire
    # codec, the negotiation cells, the rate-model regeneration). Explicit
    # wiring — standalone plugins are not auto-discovered. Minimal cost:
    # stdlib-only tests under an isolated pinned pytest, no project env.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.13"
      - name: Version-literal zero gate (plugins + docs scopes)
        run: python3 scripts/standards/count_version_literals.py --scope plugins,docs
      - name: Isolate the device project from the core checkout
        run: cp -R "plugins/benchweave/adc_6ch_12bit" "$RUNNER_TEMP/adc6ch"
      - name: Prime the interpreter and the pinned pytest into the uv cache (online)
        # The dps150 lane's ordering: its ONLINE uv sync materialises the
        # managed interpreter and the cached wheels its later --offline
        # steps reuse. This project deliberately has no pyproject, so the
        # prime is the same isolated invocation WITHOUT --offline — it
        # caches the 3.13 interpreter and the pinned pytest wheel; a bare
        # --offline first run would fail in seconds (no interpreter, no
        # cache, downloads forbidden).
        working-directory: ${{ runner.temp }}/adc6ch
        run: uv run --isolated --no-project --with pytest==9.1.1 python -m pytest tests -q --collect-only
      - name: Offline tests with an isolated pinned pytest
        working-directory: ${{ runner.temp }}/adc6ch
        run: |
          uv run --isolated --no-project --offline \
            --with pytest==9.1.1 python -m pytest tests -q

  legacy-simulator-packages:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        model: [sim_psu, sim_controller]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.13"
      - name: Build the explicit private-API gateway dependency
        run: uv build --wheel --out-dir "$RUNNER_TEMP/gateway"
      - name: Isolate the simulator project
        run: cp -R "plugins/benchweave/${{ matrix.model }}" "$RUNNER_TEMP/simulator"
      - name: Build the simulator wheel from its source distribution
        working-directory: ${{ runner.temp }}/simulator
        run: uv build --out-dir "$RUNNER_TEMP/simulator-dist"
      - name: Replay synthetic vectors with installed wheels outside the checkout
        working-directory: ${{ runner.temp }}/simulator
        run: |
          uv run --isolated --no-project \
            --with "$RUNNER_TEMP"/gateway/benchweave-*.whl \
            --with "$RUNNER_TEMP/simulator-dist/benchweave_${{ matrix.model }}-0.1.0-py3-none-any.whl" \
            --with pytest==9.1.1 python -m pytest tests
