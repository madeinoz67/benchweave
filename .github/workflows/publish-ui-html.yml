name: Publish ui-html

# Issue #302 first release, design §2.2
# (.claude/deep-review/2026-10-02-issue302-first-release-design.md).
# Release-published trigger only (fork d: no workflow_dispatch in v1 — the
# missed-event recovery is re-publishing the release object; the first
# missed/dropped event is the named trigger to add the dispatch arm). There is
# deliberately NO tags filter: `tags` is not a valid construct under the
# `release` event (actionlint refuses it), so the tag-namespace element is the
# job-level guard every job below carries — a gateway v* release fires this
# workflow but skips all four jobs.
on:
  release:
    types: [published]

permissions:
  contents: read

# Serialize publish runs (risk 6): one release publishes at a time, and a
# later run never cancels an in-flight one.
concurrency:
  group: publish-ui-html
  cancel-in-progress: false

jobs:
  build:
    name: Build at the release tag
    if: startsWith(github.event.release.tag_name, 'ui-html-v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Env indirection, never ${{ }} inside run: — the release tag is
      # attacker-shaped legal-ref text; parameter expansion inside quotes
      # never re-evaluates it (refute lane A, MEDIUM; the SDK publish.yml
      # precedent passes its tag the same way).
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Never build the default branch — and never a re-resolved name:
          # github.sha on the release event is the tag's commit ("last commit
          # in the tagged release"), pinned per attempt, so a moved tag cannot
          # re-target a re-run (refute lane A, LOW).
          ref: ${{ github.sha }}
          persist-credentials: false
          submodules: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.16"
      - run: uv python install 3.13
      - name: Release tag must equal ui-html-v + the pyproject version
        # The SDK verify_release_tag.py role and semantics, inlined (no new
        # script file): a plain removeprefix string compare with NO PEP 440
        # parsing, so any normalization divergence between tag and version
        # fails CLOSED as a mismatch rather than rounding to a match.
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG}"
          version="$(uv run --no-project --python 3.13 python -I -c 'import sys, tomllib
          print(tomllib.load(open(sys.argv[1], "rb"))["project"]["version"])' \
            packages/ui-html/pyproject.toml)"
          expected="ui-html-v${version}"
          if [ "$tag" != "$expected" ]; then
            echo "release tag '$tag' != pyproject-derived '$expected'" >&2
            echo "(single source: packages/ui-html/pyproject.toml [project].version)" >&2
            exit 1
          fi
          echo "tag matches pyproject version: $tag"
      - name: Build sdist and wheel from the tag
        # uv's default builds the wheel from the sdist, proving both.
        run: uv build --out-dir dist packages/ui-html
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-ui-html
          path: dist/
          if-no-files-found: error

  smoke:
    name: Installed-wheel smoke (${{ matrix.os }})
    if: startsWith(github.event.release.tag_name, 'ui-html-v')
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # The package.yml pair; a pure-Python wheel is OS-invariant and
        # .gitattributes normalizes line endings machine-wide (eol=lf) —
        # no Windows leg (design §2.2, disclosed non-goal).
        os: [ubuntu-latest, macos-latest]
    env:
      # matrix.os is workflow-static (never attacker-controlled); env
      # indirection keeps the run block free of template expansion entirely,
      # so the file stays clean under workflow security audit.
      SMOKE_OS: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The census's source side: the checkout tree AT the tag's commit
          # (github.sha — pinned per attempt, same rationale as the build job).
          ref: ${{ github.sha }}
          persist-credentials: false
          submodules: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-ui-html
          path: dist
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.16"
      - run: uv python install 3.13
      - name: Fresh venv outside any checkout; install, assert, census
        # Mirrors the package.yml ui-html step (the landed lane) plus the
        # same resource census — re-proven at the tag before anything
        # reaches PyPI.
        run: |
          set -euo pipefail
          wheels=(dist/benchweave_ui_html-*.whl)
          if [ "${#wheels[@]}" -ne 1 ] || [ ! -e "${wheels[0]}" ]; then
            echo "expected exactly one ui-html wheel in dist, found: ${wheels[*]}" >&2
            exit 1
          fi
          venv="$RUNNER_TEMP/ui-html-venv"
          python_bin="$venv/bin/python"
          uv venv --python 3.13 "$venv"
          uv pip install --python "$python_bin" "${wheels[0]}"
          echo "ui-html: import from the isolated venv (no checkout on sys.path)"
          "$python_bin" -I -c 'import pathlib, sys, benchweave_ui_html
          module = pathlib.Path(benchweave_ui_html.__file__).resolve()
          venv = pathlib.Path(sys.argv[1]).resolve()
          assert module.is_relative_to(venv), f"imported from outside the venv: {module}"' "$venv"
          expected_version="$(uv run --no-project --python 3.13 python -I -c 'import sys, tomllib
          print(tomllib.load(open(sys.argv[1], "rb"))["project"]["version"])' \
            packages/ui-html/pyproject.toml)"
          "$python_bin" -I -c 'import sys
          from importlib.metadata import version
          installed = version("benchweave-ui-html")
          assert installed == sys.argv[1], f"wheel version {installed} != pyproject {sys.argv[1]}"' \
            "$expected_version"
          installed_list="$(uv pip list --python "$python_bin" --format freeze)"
          names="$(printf '%s\n' "$installed_list" | cut -d= -f1 | sort)"
          expected_names="$(printf '%s\n' benchweave-ui-html jinja2 markupsafe | sort)"
          if [ "$names" != "$expected_names" ]; then
            echo "installed set is not exactly {benchweave-ui-html, jinja2, markupsafe}:" >&2
            echo "$installed_list" >&2
            exit 1
          fi
          installed_pkg="$("$python_bin" -I -c 'import pathlib, benchweave_ui_html
          print(pathlib.Path(benchweave_ui_html.__file__).resolve().parent)')"
          "$python_bin" -I -c 'import pathlib, sys
          src, inst = (pathlib.Path(a).resolve() for a in sys.argv[1:3])
          def tree(p):
              return {f.relative_to(p).as_posix(): f.read_bytes()
                      for f in p.rglob("*") if f.is_file() and "__pycache__" not in f.parts}
          s, i = tree(src), tree(inst)
          seen = {}
          for k in s:
              fk = k.lower()
              assert fk not in seen, ("case-colliding package paths", seen[fk], k)
              seen[fk] = k
          assert set(s) == set(i), (sorted(set(s) - set(i)), sorted(set(i) - set(s)))
          bad = sorted(k for k in s if s[k] != i[k])
          assert not bad, bad
          print(f"ui-html census: {len(s)} files byte-identical (checkout vs installed wheel)")' \
            "$PWD/packages/ui-html/src/benchweave_ui_html" "$installed_pkg"
          "$python_bin" -I -c 'from benchweave_ui_html.assets import verify_vendored_assets
          refusals = verify_vendored_assets()
          assert refusals == [], refusals
          print("ui-html: vendored assets verified from the installed wheel")'
          echo "smoke ok on ${SMOKE_OS}: import, version, installed set, census, inventory verify"

  publish:
    name: Publish to PyPI (trusted publishing)
    if: startsWith(github.event.release.tag_name, 'ui-html-v')
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The only JOB-SCOPED id-token grant in this repository's workflows (the
    # docs.yml Pages deploy carries a separate workflow-level one — refute
    # lane B, F1): trusted publishing via OIDC, no token secret anywhere.
    # Job-scoped so the grant exists nowhere else in this run.
    permissions:
      id-token: write # trusted-publishing OIDC claim — the only job in this repo carrying it
      contents: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-ui-html
          path: dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/

  verify:
    name: Verify PyPI serves the exact built bytes
    if: startsWith(github.event.release.tag_name, 'ui-html-v')
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Same env-indirection rule as the build job (refute lane A, MEDIUM).
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-ui-html
          path: dist
      - name: PyPI read-back (version present, wheel AND sdist digests == built)
        # A read-back that only checks "version exists" cannot tell a wrong
        # or partial upload from the right one; digest equality proves the
        # exact bytes. The 6 x 10s loop absorbs PyPI index lag (SDK tap-job
        # precedent) and is false-red-only: PyPI hashes the bytes it
        # received, so a version-found-but-digest-mismatch fails LOUD
        # immediately — that is the STOP path, never retried away.
        run: |
          set -euo pipefail
          python3 - "$RELEASE_TAG" dist <<'PY'
          import hashlib
          import json
          import pathlib
          import sys
          import time
          import urllib.error
          import urllib.request

          tag = sys.argv[1]
          version = tag.removeprefix("ui-html-v")
          dist = pathlib.Path(sys.argv[2])
          built = {
              f.name: hashlib.sha256(f.read_bytes()).hexdigest()
              for f in sorted(dist.iterdir())
              if f.suffix in {".whl", ".gz"}
          }
          wheels = sorted(n for n in built if n.endswith(".whl"))
          sdists = sorted(n for n in built if n.endswith(".tar.gz"))
          assert len(wheels) == 1 and len(sdists) == 1, (wheels, sdists)
          url = f"https://pypi.org/pypi/benchweave-ui-html/{version}/json"
          last = None
          served = None
          for attempt in range(1, 7):
              try:
                  with urllib.request.urlopen(url, timeout=30) as resp:
                      served = json.load(resp)
                  break
              except (urllib.error.HTTPError, urllib.error.URLError) as exc:
                  last = exc
                  print(f"attempt {attempt}: PyPI not serving {url} yet ({exc}); retry in 10s")
                  time.sleep(10)
          assert served is not None, f"PyPI never served {url}: {last}"
          served_dig = {u["filename"]: u["digests"]["sha256"] for u in served["urls"]}
          assert set(built) == set(served_dig), (sorted(built), sorted(served_dig))
          for name in sorted(built):
              assert built[name] == served_dig[name], (name, built[name], served_dig[name])
          print(f"PyPI read-back verified: benchweave-ui-html {version} serves exactly the built bytes")
          for name in sorted(built):
              print(f"  {name} sha256={built[name]}")
          PY
