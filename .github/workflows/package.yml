name: Package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and install distribution
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.16"
          enable-cache: true
      - run: uv python install
      - run: uv lock --check
      # The default builds the wheel from the sdist, exercising both artefacts.
      - run: uv build
      - name: Smoke-test installed wheel outside the checkout
        shell: bash
        run: |
          uv venv "$RUNNER_TEMP/benchweave-smoke"
          uv pip install --python "$RUNNER_TEMP/benchweave-smoke/bin/python" dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/benchweave-smoke/bin/benchweave-adc"
          # nanodla-mcp runs a stdio server when invoked, so exercise its
          # console-script entry point by loading it (import chain + entry
          # wiring) without launching the server.
          "$RUNNER_TEMP/benchweave-smoke/bin/python" -c 'from importlib.metadata import entry_points; eps = [e for e in entry_points(group="console_scripts") if e.name == "nanodla-mcp"]; assert len(eps) == 1, eps; assert eps[0].load() is not None'
          "$RUNNER_TEMP/benchweave-smoke/bin/python" -c 'from importlib.resources import files; assert files("benchweave").joinpath("py.typed").is_file()'
