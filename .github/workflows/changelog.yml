name: changelog

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: changelog
  cancel-in-progress: false

jobs:
  changelog:
    name: Regenerate CHANGELOG.md
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Regenerate CHANGELOG.md
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
        env:
          OUTPUT: CHANGELOG.md
      - name: Commit if changed ([skip ci] + GITHUB_TOKEN push both break the loop)
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet CHANGELOG.md; then
            echo "CHANGELOG.md already up to date"
            exit 0
          fi
          git add CHANGELOG.md
          git commit -m "chore(changelog): regenerate [skip ci]"
          git push
