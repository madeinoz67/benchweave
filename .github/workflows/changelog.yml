name: changelog

on:
  push:
    branches: [main]
    paths-ignore:
      - CHANGELOG.md
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: changelog
  cancel-in-progress: false

jobs:
  changelog:
    name: Regenerate CHANGELOG.md
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check changelog app wiring
        id: wiring
        run: |
          if [ -z "${{ vars.CHANGELOG_APP_ID }}" ]; then
            echo "::warning::CHANGELOG_APP_ID variable not set — skipping changelog push. Register the changelog GitHub App, install it on this repo, then set CHANGELOG_APP_ID + CHANGELOG_APP_PRIVATE_KEY."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Create changelog app token
        if: steps.wiring.outputs.ready == 'true'
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.CHANGELOG_APP_ID }}
          private-key: ${{ secrets.CHANGELOG_APP_PRIVATE_KEY }}
          permission-contents: write
      - uses: actions/checkout@v4
        if: steps.wiring.outputs.ready == 'true'
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
      - name: Regenerate CHANGELOG.md
        if: steps.wiring.outputs.ready == 'true'
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
        env:
          OUTPUT: CHANGELOG.md
      - name: Commit changelog if changed
        if: steps.wiring.outputs.ready == 'true'
        run: |
          set -euo pipefail
          git config user.name "${{ steps.app-token.outputs.app-slug }}[bot]"
          git config user.email "${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com"
          if git diff --quiet CHANGELOG.md; then
            echo "CHANGELOG.md already up to date"
            exit 0
          fi
          git add CHANGELOG.md
          # [skip ci] is load-bearing: app-token pushes DO trigger workflows
          # (GITHUB_TOKEN pushes do not) — without it every regenerate re-runs
          # ci + device-plugins on a CHANGELOG.md-only commit.
          git commit -m "chore(changelog): regenerate [skip ci]"
          git push origin HEAD:main
