name: CI Docs

# Public Pages site: the static front door from website/ at the root and the
# Great Docs tree under docs/ (unversioned until the first release tag — see
# scripts/assemble_docs_site.py), assembled into one artifact and deployed to
# GitHub Pages on pushes to main. Same shape as the SDK repository's docs.yml.
#
# A docs build failure fails the job: no continue-on-error on any build or
# assembly step.

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  pages: write
  id-token: write

# Keyed by ref: only publish-docs touches Pages and it runs on main alone, so
# a PR build and the main build must not share a group — when they did, the
# merge's main run was cancelled in favour of the still-queued PR check
# ("higher priority waiting request for pages exists") and nothing deployed.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-docs:
    name: "Build Docs"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history + tags: refuse_if_tagged, page dates
          submodules: true # packages/sdk — importing benchweave needs the vendored trees resolved

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"

      - name: Install docs toolchain
        run: |
          sudo apt-get update && sudo apt-get install -y libcairo2 # native cairo for cairosvg raster favicons
          python -m pip install uv
          uv sync
          # [svg] is great-docs' supported cairosvg extra — without it raster favicons silently skip.
          uv pip install "great-docs[svg]"

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b # v2.2.0

      - name: Assemble the site
        run: uv run python scripts/assemble_docs_site.py

      - name: Save site artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site-html
          path: site
          include-hidden-files: true

      - name: Upload build timings
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-timings
          path: site/docs/build-timings.json
          if-no-files-found: ignore

  publish-docs:
    name: "Publish Docs"
    runs-on: ubuntu-latest
    needs: "build-docs"
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: site-html
          path: site

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
          include-hidden-files: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
