[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "benchweave-ui-html"
# 0.2.0 (G2a): the vendored JS assets land — htmx.min.js + sse.js (the
# standalone host's vetted pair, byte-identical) and the generic
# bw-host.js — as content addition on the 0.1.0 renderer (MINOR).
version = "0.2.0"
description = "Renderer-neutral HTML renderer for the BenchWeave presentation contract and its pytest contract gate."
requires-python = ">=3.13"
license = "MIT"
# UR-11: the runtime dependency set is Jinja2 and MarkupSafe ONLY — pytest is a
# test-only concern (the [dependency-groups] test extra), and the pytest11
# entry point below is inert unless pytest is the running process.
dependencies = [
  "jinja2>=3.1",
  "markupsafe>=3.0",
]

# The browser lane (UR-09/Q6, G1a deferral D2 landing; F-D1 ruled: the pip
# wrapper, NOT vendored axe.min.js bytes). A TEST extra only — the default
# install set stays {benchweave-ui-html, jinja2, markupsafe} so the
# package.yml installed-set proof is untouched. The root dev group carries
# the same pins so `uv sync --locked` resolves them (uv.lock moves with
# this change — dependency motion, disclosed in the tier call).
# DEVIATION from the G1a sketch's named floors: axe-playwright-python has
# no 4.x line (0.1.8 is the newest at design time); the floor is the real
# one below.
[project.optional-dependencies]
browser = [
  "playwright>=1.49",
  "axe-playwright-python>=0.1.7",
]

# The contract gate: collection-time generation over a non-Python target
# file, which a conftest cannot do (design record §7 — the first pytest11
# entry point in this tree). Dormant by default: it only claims files named
# ui-contract.md. Declared in the same commit as the module it names — an
# entry point whose target is absent breaks every pytest start.
[project.entry-points.pytest11]
benchweave_ui_html = "benchweave_ui_html.contract_harness.plugin"

[dependency-groups]
test = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/benchweave_ui_html"]
